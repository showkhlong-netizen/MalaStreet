name: Build Android POS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies & sync
        working-directory: android-app
        run: |
          npm install
          npx cap sync android

      - name: Build Android APK (Debug/Installable)
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk MalaStreet-POS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MalaStreet-POS-APK
          path: MalaStreet-POS.apk

      - name: Publish APK to GitHub Release (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Mala Street POS Android App (.apk)
          body: ไฟล์ติดตั้งแอป Android (.apk) สำหรับมือถือ Android และเครื่อง POS Sunmi (เปิดมาหน้าล็อกอินปกติ ใช้งานรับออเดอร์หน้าร้านและจอครัว)
          files: MalaStreet-POS.apk
          overwrite_files: true
